name: ci
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**/*.md']
  pull_request:
    paths-ignore: ['**.md', 'docs/**/*.md']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCD_SANITIZE=ON
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure --parallel 4
  # Portability gate: macOS/Apple toolchains use clang; a clang-only template failure (Json.h) once
  # slipped past the GCC job. Runs in parallel with the sanitizer job, no sanitizers (fast).
  linux-clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure --parallel 4
